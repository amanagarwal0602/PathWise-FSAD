# Server Configuration
server.port=9090

# Database Configuration (H2 in-memory for local dev)
spring.datasource.url=jdbc:h2:mem:pathwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=PathWiseCareerGuidancePlatformSecretKey2024VerySecureAndLongEnoughForHS512Algorithm
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.pathwise=DEBUG

# Disable Spring Boot DevTools automatic restart when running the packaged app
spring.devtools.restart.enabled=false
